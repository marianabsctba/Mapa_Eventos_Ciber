name: Atualizar Cyber Agenda
on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Atualizar eventos futuros
        run: python update_events.py
      - name: Publicar dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || git commit -m "chore: atualizar cyber agenda"
          git push
